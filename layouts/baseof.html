<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partialCached "validate-posts.html" site }}
  <a class="skip-link" href="#main">skip to content</a>
  <div class="site">
    <header class="site-header">
      <a class="wordmark" href="{{ site.Home.RelPermalink }}">h4vismat</a>
      <nav aria-label="Main navigation">
        <a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>home</a>
        {{ with site.GetPage "/writing" }}<a href="{{ .RelPermalink }}"{{ if eq $.Section "writing" }} aria-current="{{ if $.IsSection }}page{{ else }}true{{ end }}"{{ end }}>writing</a>{{ end }}
        {{ with site.GetPage "/about" }}<a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>about</a>{{ end }}
      </nav>
    </header>
    <main id="main" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>lucca godoy</span>
      <div><a href="mailto:h4vismat@pm.me">email</a> <a href="{{ "index.xml" | relURL }}">rss</a></div>
    </footer>
  </div>
</body>
</html>
